<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeline-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5a7cff"/>
      <stop offset="1" stop-color="#18ccff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="24" fill="url(#pipeline-grad)" opacity="0.1"/>
  <rect x="20" y="20" width="760" height="460" rx="18" fill="none" stroke="#6b7280" stroke-opacity="0.2"/>
  
  <!-- Pipeline Flow -->
  <g opacity="0.8">
    <!-- Source -->
    <rect x="80" y="200" width="120" height="80" rx="12" fill="url(#pipeline-grad)" opacity="0.3"/>
    <text x="140" y="245" text-anchor="middle" fill="#5a7cff" font-size="14" font-weight="600">Source</text>
    
    <!-- Extract -->
    <rect x="250" y="200" width="120" height="80" rx="12" fill="url(#pipeline-grad)" opacity="0.5"/>
    <text x="310" y="245" text-anchor="middle" fill="white" font-size="14" font-weight="600">Extract</text>
    
    <!-- Transform -->
    <rect x="420" y="200" width="120" height="80" rx="12" fill="url(#pipeline-grad)" opacity="0.7"/>
    <text x="480" y="245" text-anchor="middle" fill="white" font-size="14" font-weight="600">Transform</text>
    
    <!-- Load -->
    <rect x="590" y="200" width="120" height="80" rx="12" fill="url(#pipeline-grad)"/>
    <text x="650" y="245" text-anchor="middle" fill="white" font-size="14" font-weight="600">Load</text>
  </g>
  
  <!-- Flow arrows -->
  <g fill="url(#pipeline-grad)" opacity="0.6">
    <path d="M 200 240 L 240 240 L 230 230 Z"/>
    <path d="M 370 240 L 410 240 L 400 230 Z"/>
    <path d="M 540 240 L 580 240 L 570 230 Z"/>
  </g>
  
  <!-- Data blocks -->
  <g opacity="0.4">
    <rect x="100" y="320" width="60" height="40" rx="6" fill="#5a7cff"/>
    <rect x="180" y="320" width="60" height="40" rx="6" fill="#18ccff"/>
    <rect x="260" y="320" width="60" height="40" rx="6" fill="#5a7cff"/>
    <rect x="340" y="320" width="60" height="40" rx="6" fill="#18ccff"/>
  </g>
  
  <!-- Schema evolution indicator -->
  <g opacity="0.5">
    <circle cx="480" cy="350" r="8" fill="url(#pipeline-grad)"/>
    <path d="M 480 342 L 485 350 L 480 358 L 475 350 Z" fill="white"/>
  </g>
  
  <!-- Metrics -->
  <text x="400" y="420" text-anchor="middle" fill="#5a7cff" font-size="18" font-weight="700" opacity="0.8">43k+ Tests</text>
  <text x="400" y="440" text-anchor="middle" fill="#6b7280" font-size="11" opacity="0.7">Processed</text>
</svg>
