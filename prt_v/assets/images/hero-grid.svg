<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a7cff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#18ccff" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#5a7cff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5a7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="none"/>
  
  <!-- Neural Network Nodes -->
  <g opacity="0.7">
    <!-- Input Layer -->
    <circle cx="200" cy="200" r="12" fill="url(#hero-grad)"/>
    <circle cx="200" cy="300" r="12" fill="url(#hero-grad)"/>
    <circle cx="200" cy="400" r="12" fill="url(#hero-grad)"/>
    <circle cx="200" cy="500" r="12" fill="url(#hero-grad)"/>
    <circle cx="200" cy="600" r="12" fill="url(#hero-grad)"/>
    
    <!-- Hidden Layer 1 -->
    <circle cx="500" cy="150" r="14" fill="url(#hero-grad)"/>
    <circle cx="500" cy="250" r="14" fill="url(#hero-grad)"/>
    <circle cx="500" cy="350" r="14" fill="url(#hero-grad)"/>
    <circle cx="500" cy="450" r="14" fill="url(#hero-grad)"/>
    <circle cx="500" cy="550" r="14" fill="url(#hero-grad)"/>
    <circle cx="500" cy="650" r="14" fill="url(#hero-grad)"/>
    
    <!-- Hidden Layer 2 -->
    <circle cx="800" cy="200" r="16" fill="url(#hero-grad)"/>
    <circle cx="800" cy="300" r="16" fill="url(#hero-grad)"/>
    <circle cx="800" cy="400" r="16" fill="url(#hero-grad)"/>
    <circle cx="800" cy="500" r="16" fill="url(#hero-grad)"/>
    <circle cx="800" cy="600" r="16" fill="url(#hero-grad)"/>
    
    <!-- Output Layer -->
    <circle cx="1100" cy="350" r="18" fill="url(#hero-grad)"/>
    <circle cx="1100" cy="450" r="18" fill="url(#hero-grad)"/>
  </g>
  
  <!-- Neural Network Connections -->
  <g stroke="url(#hero-grad)" stroke-width="1.5" opacity="0.3">
    <!-- Input to Hidden 1 -->
    <line x1="212" y1="200" x2="486" y2="150"/>
    <line x1="212" y1="300" x2="486" y2="250"/>
    <line x1="212" y1="400" x2="486" y2="350"/>
    <line x1="212" y1="500" x2="486" y2="450"/>
    <line x1="212" y1="600" x2="486" y2="550"/>
    
    <!-- Hidden 1 to Hidden 2 -->
    <line x1="514" y1="150" x2="784" y2="200"/>
    <line x1="514" y1="250" x2="784" y2="300"/>
    <line x1="514" y1="350" x2="784" y2="400"/>
    <line x1="514" y1="450" x2="784" y2="500"/>
    <line x1="514" y1="550" x2="784" y2="600"/>
    
    <!-- Hidden 2 to Output -->
    <line x1="816" y1="300" x2="1082" y2="350"/>
    <line x1="816" y1="400" x2="1082" y2="400"/>
    <line x1="816" y1="500" x2="1082" y2="450"/>
  </g>
  
  <!-- Data Points / Scatter -->
  <g opacity="0.4">
    <circle cx="300" cy="100" r="3" fill="#5a7cff"/>
    <circle cx="400" cy="120" r="3" fill="#18ccff"/>
    <circle cx="600" cy="80" r="3" fill="#5a7cff"/>
    <circle cx="700" cy="100" r="3" fill="#18ccff"/>
    <circle cx="900" cy="120" r="3" fill="#5a7cff"/>
    <circle cx="1000" cy="100" r="3" fill="#18ccff"/>
  </g>
  
  <!-- Chart Lines -->
  <path d="M 100 700 Q 300 600, 500 650 T 900 600 T 1100 650" 
        fill="none" stroke="url(#hero-grad)" stroke-width="3" opacity="0.5"/>
  
  <!-- Frame -->
  <rect x="6" y="6" width="1188" height="788" rx="24" fill="none" stroke="#6b7280" stroke-opacity="0.15"/>
</svg>
