<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fraud-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a7cff"/>
      <stop offset="1" stop-color="#18ccff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="24" fill="url(#fraud-grad)" opacity="0.1"/>
  <rect x="20" y="20" width="760" height="460" rx="18" fill="none" stroke="#6b7280" stroke-opacity="0.2"/>
  
  <!-- Graph Network Nodes -->
  <g opacity="0.8">
    <!-- Central node (fraud detection) -->
    <circle cx="400" cy="250" r="25" fill="url(#fraud-grad)"/>
    <circle cx="400" cy="250" r="30" fill="url(#fraud-grad)" opacity="0.2"/>
    
    <!-- Connected nodes -->
    <circle cx="200" cy="150" r="15" fill="#5a7cff" opacity="0.7"/>
    <circle cx="600" cy="150" r="15" fill="#5a7cff" opacity="0.7"/>
    <circle cx="200" cy="350" r="15" fill="#18ccff" opacity="0.7"/>
    <circle cx="600" cy="350" r="15" fill="#18ccff" opacity="0.7"/>
    <circle cx="100" cy="250" r="15" fill="#5a7cff" opacity="0.7"/>
    <circle cx="700" cy="250" r="15" fill="#18ccff" opacity="0.7"/>
  </g>
  
  <!-- Connections -->
  <g stroke="url(#fraud-grad)" stroke-width="2" opacity="0.4">
    <line x1="400" y1="250" x2="200" y2="150"/>
    <line x1="400" y1="250" x2="600" y2="150"/>
    <line x1="400" y1="250" x2="200" y2="350"/>
    <line x1="400" y1="250" x2="600" y2="350"/>
    <line x1="400" y1="250" x2="100" y2="250"/>
    <line x1="400" y1="250" x2="700" y2="250"/>
  </g>
  
  <!-- Alert indicators -->
  <g opacity="0.6">
    <path d="M 500 100 L 520 100 L 510 85 Z" fill="#ff4444"/>
    <circle cx="510" cy="100" r="3" fill="#ff4444"/>
  </g>
  
  <!-- Data flow lines -->
  <path d="M 50 400 Q 200 300, 400 250" fill="none" stroke="#5a7cff" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <path d="M 750 400 Q 600 300, 400 250" fill="none" stroke="#18ccff" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  
  <!-- Accuracy metric -->
  <text x="400" y="280" text-anchor="middle" fill="#5a7cff" font-size="24" font-weight="700" opacity="0.8">97.8%</text>
  <text x="400" y="300" text-anchor="middle" fill="#6b7280" font-size="12" opacity="0.7">Accuracy</text>
</svg>
